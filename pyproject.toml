[project]
name = "tts-service"
version = "0.1.0"
description = "Синтез русской речи для голосового ассистента незрячих"
authors = [
    {name = "Nikita Karpov", email = "nikita.karpov@ainergy.ru"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
  # --- API --------------------------------------------------------
  "fastapi[standard]>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "python-multipart>=0.0.33,<0.1.0",
  "pydantic>=2.14.0",
  "pydantic-settings>=2.16.0",
  "loguru>=0.7.3",

  # --- Models -----------------------------------------------------
  "numpy>=2.5.0",
  "huggingface-hub>=1.0.0",

  # --- Audio and phrases ------------------------------------------
  "scipy>=1.18.1,<2.0.0",
  "pyyaml>=6.0.3",
]

# ---------------------------------------------------------------------------
# Profiles. The backend libraries are extras of their own (NFR-13): the
# registry imports a backend only when it is chosen, so the service installs
# and passes its fast tests without them.
# ---------------------------------------------------------------------------
[project.optional-dependencies]

# CPU wheels, so no CUDA payload. torchaudio is a dependency of f5-tts and has to
# come from the same index as torch: the PyPI wheel is a CUDA build.
cpu = [
  "torch>=2.14.0,<2.15.0",
  "torchaudio>=2.9.0",
]

# CUDA wheels for the GPU image.
gpu = [
  "torch>=2.14.0,<2.15.0",
  "torchaudio>=2.9.0",
]

# Silero TTS: a model is a torch.package file and runs on torch alone, so the
# extra only marks the backend as wanted. The Russian models are CC BY-NC-SA 4.0.
silero = [
  "torch>=2.14.0,<2.15.0",
]

# Piper: the library is GPL-3.0; the voices carry licenses of their own.
piper = [
  "piper-tts>=1.8.0,<2.0.0",
]

# F5-TTS: the code is MIT, the Russian weights are CC BY-NC 4.0. Needs a GPU.
f5tts = [
  "f5-tts>=1.1.22,<2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  # The model smoke test (AC-84) runs the piper backend: onnxruntime and no torch,
  # so the test environment stays light. A test tool only: the images install no
  # dev group, the GPL library reaches them through the piper extra alone
  "piper-tts>=1.8.0,<2.0.0",
]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "gpu", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "gpu", marker = "sys_platform != 'darwin'" },
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "model: needs model weights; out of the fast run",
]
addopts = "--strict-markers"
